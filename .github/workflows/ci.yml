name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/portal/package-lock.json
      - name: Install dependencies
        working-directory: frontend/portal
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend/portal
        run: npm test
      - name: Build frontend
        working-directory: frontend/portal
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-portal.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-portal.txt pytest httpx
      - name: Run Python tests
        run: python -m pytest tests/ -q

  containers:
    name: Validate Docker Compose images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build frontend and backend images
        run: docker compose build
